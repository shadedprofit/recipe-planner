services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      INGREDIENT_EXTRACTION_PROVIDER: ${INGREDIENT_EXTRACTION_PROVIDER:-gemini}
      RECIPE_GENERATION_PROVIDER: ${RECIPE_GENERATION_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_INGREDIENT_MODEL: ${GEMINI_INGREDIENT_MODEL:-gemini-2.5-flash}
      GEMINI_RECIPE_MODEL: ${GEMINI_RECIPE_MODEL:-gemini-2.5-flash}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PORT: ${PORT:-3001}
      RECIPE_DB_PATH: /data/recipes.db
    ports:
      - '${PORT:-3001}:${PORT:-3001}'
    volumes:
      - recipe-planner-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:'' + (process.env.PORT || ''3001'') + ''/health'').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: mobile/Dockerfile
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:${PORT:-3001}}
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  recipe-planner-data:
